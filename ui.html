<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Podium Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #ff1801;
            --accent-hover: #ff3b26;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(0, 0, 0, 0.5);
            --success: #00ff88;
            --danger: #ff1801;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 24, 1, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header h1 span {
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 1fr 350px;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-section-title::before {
            content: '';
            display: block;
            width: 4px;
            height: 18px;
            background: var(--accent);
            border-radius: 4px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        select {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 24, 1, 0.2);
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.5rem;
            cursor: pointer;
        }

        .checkbox-group input {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1px solid var(--card-border);
            border-radius: 5px;
            background: var(--input-bg);
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .checkbox-group input:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .checkbox-group input:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        button.predict-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1.2rem;
            width: 100%;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        button.predict-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 24, 1, 0.3);
        }

        button.predict-btn:active {
            transform: translateY(1px);
        }

        /* Result Panel */
        .result-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            min-height: 300px;
            position: relative;
        }

        .result-placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        .result-placeholder svg {
            width: 64px;
            height: 64px;
            opacity: 0.2;
            margin-bottom: 1rem;
        }

        .result-content {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .prediction-value {
            font-size: 2.5rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .value-yes { color: var(--success); }
        .value-no { color: var(--danger); }

        .probability-circle {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: conic-gradient(var(--accent) 0%, var(--input-bg) 0%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .probability-circle::before {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            background: var(--bg-color);
            border-radius: 50%;
        }

        .probability-text {
            position: relative;
            font-size: 2rem;
            font-weight: 800;
        }

        .model-info {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
            width: 100%;
        }

        .loader {
            display: none;
            width: 48px;
            height: 48px;
            border: 5px solid var(--card-border);
            border-bottom-color: var(--accent);
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 24, 1, 0.9);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>F1 <span>Podium</span> Predictor</h1>
        <p>AI-Powered Race Outcomes using XGBoost</p>
    </div>

    <div class="container">
        <!-- Form Section -->
        <div class="card form-container">
            <form id="prediction-form">
                
                <div class="form-section-title">Context & Identity</div>
                <div class="grid-layout">
                    <div class="input-group">
                        <label>Driver Name</label>
                        <input type="text" id="driver_name" value="Max Verstappen" required>
                    </div>
                    <div class="input-group">
                        <label>Constructor Name</label>
                        <input type="text" id="constructor_name" value="Red Bull" required>
                    </div>
                    <div class="input-group">
                        <label>Season</label>
                        <input type="number" id="season" value="2024" required>
                    </div>
                    <div class="input-group">
                        <label>Round</label>
                        <input type="number" id="round" value="1" required>
                    </div>
                </div>

                <div class="form-section-title">Current Performance</div>
                <div class="grid-layout">
                    <div class="input-group">
                        <label>Championship Standing</label>
                        <input type="number" id="championship_standing" value="1" required>
                    </div>
                    <div class="input-group">
                        <label>Championship Points</label>
                        <input type="number" step="0.5" id="championship_points" value="0" required>
                    </div>
                    <div class="input-group">
                        <label>Constructor Standing</label>
                        <input type="number" id="constructor_championship_standing" value="1" required>
                    </div>
                    <div class="input-group">
                        <label>Driver Recent Form</label>
                        <input type="number" step="0.01" id="driver_recent_form" value="1.0" required>
                    </div>
                </div>

                <div class="form-section-title">History & Race Details</div>
                <div class="grid-layout">
                    <div class="input-group">
                        <label>Age at Race (Years)</label>
                        <input type="number" step="0.1" id="age_at_race" value="26.5" required>
                    </div>
                    <div class="input-group">
                        <label>Years of Experience</label>
                        <input type="number" step="0.1" id="years_of_experience" value="9.0" required>
                    </div>
                    <div class="input-group">
                        <label>Career Wins</label>
                        <input type="number" id="career_wins_before_race" value="54" required>
                    </div>
                    <div class="input-group">
                        <label>Career Podiums</label>
                        <input type="number" id="career_podiums_before_race" value="98" required>
                    </div>
                    <div class="input-group">
                        <label>Grid Position</label>
                        <input type="number" id="grid_position" value="1" required>
                    </div>
                </div>

                <div class="form-section-title">Data Flags</div>
                <div class="grid-layout">
                    <label class="checkbox-group">
                        <input type="checkbox" id="grid_position_missing">
                        Grid Position Missing
                    </label>
                    <label class="checkbox-group">
                        <input type="checkbox" id="driver_recent_form_missing">
                        Recent Form Missing
                    </label>
                </div>

                <button type="submit" class="predict-btn">Generate Prediction</button>
            </form>
        </div>

        <!-- Result Section -->
        <div class="card result-panel">
            <div class="loader" id="loader"></div>
            
            <div class="result-placeholder" id="result-placeholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="10 8 16 12 10 16 10 8"></polygon>
                </svg>
                <p>Fill out the data and click predict to see the model's output.</p>
            </div>

            <div class="result-content" id="result-content">
                <p style="text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Prediction</p>
                <div class="prediction-value" id="pred-text">PODIUM</div>
                
                <div class="probability-circle" id="prob-circle">
                    <div class="probability-text" id="prob-text">0%</div>
                </div>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Podium Probability</p>

                <div class="model-info">
                    Model Version: <span id="model-version" style="color: white; font-weight: 500;">v1.2.0</span>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Prediction failed!</div>

    <script>
        document.getElementById('prediction-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.querySelector('.predict-btn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('result-placeholder');
            const content = document.getElementById('result-content');
            
            // Collect data
            const payload = {
                season: parseInt(document.getElementById('season').value),
                round: parseInt(document.getElementById('round').value),
                driver_name: document.getElementById('driver_name').value,
                constructor_name: document.getElementById('constructor_name').value,
                constructor_championship_standing: parseInt(document.getElementById('constructor_championship_standing').value),
                championship_standing: parseInt(document.getElementById('championship_standing').value),
                championship_points: parseFloat(document.getElementById('championship_points').value),
                grid_position: parseInt(document.getElementById('grid_position').value),
                age_at_race: parseFloat(document.getElementById('age_at_race').value),
                years_of_experience: parseFloat(document.getElementById('years_of_experience').value),
                career_wins_before_race: parseInt(document.getElementById('career_wins_before_race').value),
                career_podiums_before_race: parseInt(document.getElementById('career_podiums_before_race').value),
                driver_recent_form: parseFloat(document.getElementById('driver_recent_form').value),
                grid_position_missing: document.getElementById('grid_position_missing').checked ? 1 : 0,
                driver_recent_form_missing: document.getElementById('driver_recent_form_missing').checked ? 1 : 0
            };

            // UI Loading state
            btn.disabled = true;
            btn.style.opacity = '0.7';
            placeholder.style.display = 'none';
            content.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                // Update UI with results
                const predText = document.getElementById('pred-text');
                const probText = document.getElementById('prob-text');
                const probCircle = document.getElementById('prob-circle');
                const modelVersion = document.getElementById('model-version');

                if (data.prediction) {
                    predText.textContent = "PODIUM";
                    predText.className = "prediction-value value-yes";
                    probCircle.style.background = `conic-gradient(var(--success) ${data.podium_probability * 100}%, var(--input-bg) 0%)`;
                } else {
                    predText.textContent = "NO PODIUM";
                    predText.className = "prediction-value value-no";
                    probCircle.style.background = `conic-gradient(var(--accent) ${data.podium_probability * 100}%, var(--input-bg) 0%)`;
                }

                probText.textContent = `${(data.podium_probability * 100).toFixed(1)}%`;
                modelVersion.textContent = `v${data.model_version}`;

                loader.style.display = 'none';
                content.style.display = 'block';

            } catch (error) {
                console.error('Error:', error);
                loader.style.display = 'none';
                placeholder.style.display = 'block';
                
                const toast = document.getElementById('toast');
                toast.textContent = 'Prediction failed. Check console for details.';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            } finally {
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
